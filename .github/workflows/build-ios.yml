name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Generate native iOS project
        run: |
          npx react-native@0.74.5 init TempNative --version 0.74.5 --skip-install --pm npm
          mv TempNative/ios ./ios
          rm -rf TempNative

          # استبدال الاسم داخل كل الملفات النصية (يشمل Podfile)
          grep -rlI "TempNative" ios | xargs sed -i '' 's/TempNative/MovieApp/g'

          # إعادة تسمية أي ملف أو مجلد اسمه TempNative
          find ios -depth -name "*TempNative*" | while read -r path; do
            newpath=$(echo "$path" | sed 's/TempNative/MovieApp/g')
            mv "$path" "$newpath"
          done

      - name: Install CocoaPods
        run: cd ios && pod install && cd ..

      - name: Build unsigned .app
        run: |
          xcodebuild -workspace ios/MovieApp.xcworkspace \
            -scheme MovieApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/MovieApp.app Payload/
          zip -r MovieApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: MovieApp.ipa
