name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: ''

      - name: Install JS dependencies
        run: npm install

      - name: Create Proper IPA Structure
        run: |
          rm -rf payload
          mkdir -p payload/Payload/iTV.app
          
          # إنشاء ملف معلومات التطبيق الأساسي Info.plist لكي تقبله أدوات التوقيع
          cat << 'EOF' > payload/Payload/iTV.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          dict>
              <key>CFBundleIdentifier</key>
              <string>com.itv.app</string>
              <key>CFBundleName</key>
              <string>iTV</string>
              <key>CFBundleDisplayName</key>
              <string>iTV</string>
              <key>CFBundleExecutable</key>
              <string>iTV</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>13.0</string>
          </dict>
          </plist>
          EOF

          # بناء حزمة الجافا اسكريبت للتطبيق ووضعها مباشرة داخل ملف الـ app
          npx react-native bundle --platform ios --dev false --entry-file index.js --bundle-output payload/Payload/iTV.app/main.jsbundle || true

          # إنشاء ملف تنفيذي فارغ (Placeholder) ليتوافق مع متطلبات التوقيع
          touch payload/Payload/iTV.app/iTV
          chmod +x payload/Payload/iTV.app/iTV

          # ضغط الملفات بصيغة IPA سليمة
          cd payload
          zip -r ../iTV.ipa Payload
          cd ..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iTV-IPA
          path: iTV.ipa
