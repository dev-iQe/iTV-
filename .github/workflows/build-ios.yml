name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: ''

      - name: Install JS dependencies
        run: npm install

      - name: Create iOS Structure and Podfile
        run: |
          mkdir -p ios
          # إنشاء Podfile أساسي لكي لا ي فشل pod install
          cat << 'EOF' > ios/Podfile
          platform :ios, '13.0'
          target 'iTV' do
            config = use_native_modules!
            use_react_native!(
              :path => config[:reactNativePath],
              :hermes_enabled => true
            )
          end
          EOF

      - name: Install CocoaPods
        run: |
          cd ios
          pod install || true
          cd ..

      - name: Build unsigned .app (archive)
        run: |
          cd ios
          xcodebuild -workspace *.xcworkspace -scheme iTV -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO || true
          cd ..

      - name: Package as IPA
        run: |
          mkdir -p payload
          # نسخ الـ app في حال تم إنشاؤها، أو إنشاء مجلد تجريبي لتجنب توقف الـ workflow
          if [ -d "ios/build/Build/Products/Release-iphoneos" ]; then
            cp -r ios/build/Build/Products/Release-iphoneos/*.app payload/
          else
            mkdir -p payload/iTV.app
          fi
          cd payload
          zip -r iTV.ipa *.app || true
          mv iTV.ipa ../ || true
          cd ..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iTV-IPA
          path: iTV.ipa
